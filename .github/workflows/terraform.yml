name: Terraform (Banco de Dados)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    name: Formatação e validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  plan-apply:
    name: ${{ github.event_name == 'push' && 'apply (deploy automático)' || inputs.action }}
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    env:
      TF_IN_AUTOMATION: 'true'
      TF_ACTION: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
      TF_VAR_db_name: ${{ vars.DB_NAME || 'oficina_mecanica' }}
      TF_VAR_db_username: ${{ vars.DB_USERNAME || 'oficina' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validar configuração do pipeline
        run: |
          missing=()
          [[ -n "${{ vars.AWS_REGION }}" ]] || missing+=("AWS_REGION (variable)")
          [[ -n "${{ vars.TF_STATE_BUCKET }}" ]] || missing+=("TF_STATE_BUCKET (variable)")
          [[ -n "${{ secrets.DB_PASSWORD }}" ]] || missing+=("DB_PASSWORD (secret)")
          if (( ${#missing[@]} )); then
            echo "Configuração ausente no GitHub Actions: ${missing[*]}" >&2
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configurar backend remoto
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: terraform init
        run: |
          backend_args=(
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
            -backend-config="key=${{ vars.TF_STATE_KEY || 'oficina-mecanica/db/terraform.tfstate' }}"
            -backend-config="region=${{ vars.AWS_REGION }}"
            -backend-config="encrypt=true"
          )
          if [[ -n "${{ vars.TF_STATE_DYNAMODB_TABLE }}" ]]; then
            backend_args+=(-backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}")
          fi
          terraform init -input=false "${backend_args[@]}"

      - name: terraform plan
        if: env.TF_ACTION != 'destroy'
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        if: env.TF_ACTION == 'apply'
        run: terraform apply -input=false tfplan

      - name: terraform destroy
        if: env.TF_ACTION == 'destroy'
        run: terraform destroy -input=false -auto-approve
